# Nginx Reverse Proxy for Quiz Platform
# Supports Tailscale Funnel, Cloudflare Tunnel, and direct HTTPS
# Handles SSL termination, rate limiting, and security headers

# Events context - required for nginx
events {
    worker_connections 1024;
}

# HTTP context - rate limiting zones must be here
http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=quiz_limit:10m rate=60r/m;

    # Upstream definitions
    upstream frontend {
        server quiz-frontend:80;
    }

    upstream api {
        server quiz-api:8000;
    }

    # HTTP server - main entry point
    # For Tailscale Funnel/Cloudflare Tunnel, they handle HTTPS termination externally
    # This container receives plain HTTP and proxies to services
    server {
        listen 80;
        server_name _;

        # Allow health checks on HTTP
        location /health {
            proxy_pass http://frontend/health;
            access_log off;
        }

        # ACME challenge for Let's Encrypt (if using custom domain)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # API endpoints with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Health checks (no rate limit)
        location /api/quiz/health {
            proxy_pass http://api/api/quiz/health;
            access_log off;
        }

        # For Tailscale Funnel/Cloudflare Tunnel - they handle HTTPS
        # Pass through to frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server - only enabled when SSL certificates are available
    # For local dev: mount certs to /etc/nginx/certs/
    # For Tailscale Funnel/Cloudflare Tunnel: they handle TLS externally, this is optional
    # If certs exist, this server block will be used
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL certificates (mounted from /etc/nginx/certs)
        # For Tailscale Funnel: certs are auto-generated
        # For Cloudflare Tunnel: certs are handled by cloudflared
        # For custom domain: use Let's Encrypt certs
        # If certs don't exist, this server will fail to start - mount certs to enable HTTPS
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://chatgpt.com https://gemini.google.com;" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # Frontend - serve static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # API endpoints with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Health checks (no rate limit)
        location /health {
            proxy_pass http://api/health;
            access_log off;
        }

        location /api/quiz/health {
            proxy_pass http://api/api/quiz/health;
            access_log off;
        }

        # Root and SPA fallback
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}