# Docker Compose for Quiz Platform - Self-Hosted Deployment
# Optimized for home server with memory constraints (<250MB total)
# Supports Tailscale Funnel and Cloudflare Tunnel exposure

version: '3.8'

services:
  # Backend API service - FastAPI with Uvicorn
  quiz-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-platform-api
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-100}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "127.0.0.1:8000:8000"  # Bind to localhost only for security
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
    networks:
      - quiz-network

  # Frontend service - Nginx serving static assets
  quiz-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz-platform-frontend
    ports:
      - "127.0.0.1:8080:80"  # Bind to localhost only for security
    depends_on:
      quiz-api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 50M
          cpus: '0.25'
        reservations:
          memory: 16M
          cpus: '0.1'
    networks:
      - quiz-network

  # Reverse proxy - Nginx with Tailscale/Cloudflare support
  # Handles SSL termination, rate limiting, and security headers
  quiz-proxy:
    image: nginx:alpine
    container_name: quiz-platform-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - quiz-frontend
      - quiz-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.25'
        reservations:
          memory: 16M
          cpus: '0.1'
    networks:
      - quiz-network

networks:
  quiz-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Usage:
# 1. Copy .env.example to .env and fill in your API keys
# 2. For Tailscale Funnel: tailscale funnel 443 (after running docker compose up -d)
# 3. For Cloudflare Tunnel: cloudflared tunnel run --config cloudflared.yml <tunnel-name>