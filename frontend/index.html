<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dynamic MCQ practice platform with AI-powered question generation" />
  <title>Quiz Lab — Dynamic MCQ Practice Platform</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-bold">
        <span class="text-indigo-600 dark:text-indigo-400">Quiz</span>Lab
      </h1>
      <div class="flex items-center gap-3">
        <span id="scoreChip" class="hidden px-2 py-0.5 rounded-full text-xs font-semibold"></span>
        <button id="themeBtn" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle theme">
          <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
        </button>
        <button id="resetBtn" class="hidden px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          ← New Quiz
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <!-- Configuration Panel -->
    <section id="configPanel" class="space-y-6">
      <div class="card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6">
        <h2 class="text-xl font-bold mb-4">Generate Quiz</h2>

        <!-- Topic Input -->
        <div class="mb-4">
          <label for="topicInput" class="block text-sm font-medium mb-2">Topic</label>
          <input
            type="text"
            id="topicInput"
            placeholder="e.g., AWS S3 storage fundamentals, Python decorators, Machine learning basics..."
            class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
          >
          <p id="topicError" class="hidden mt-1 text-xs text-rose-500"></p>
        </div>

        <!-- Options Row -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <!-- Difficulty -->
          <div>
            <label for="difficultySelect" class="block text-sm font-medium mb-2">Difficulty</label>
            <select
              id="difficultySelect"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none transition"
            >
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>

          <!-- Count -->
          <div>
            <label for="countInput" class="block text-sm font-medium mb-2">Questions</label>
            <input
              type="number"
              id="countInput"
              value="10"
              min="1"
              max="50"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none transition"
            >
          </div>

          <!-- Question Type -->
          <div>
            <label class="block text-sm font-medium mb-2">Type</label>
            <div class="flex gap-2">
              <label class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 dark:has-[:checked]:bg-indigo-900/30 transition">
                <input type="radio" name="questionType" value="mixed" checked class="sr-only">
                <span class="text-sm">Mixed</span>
              </label>
              <label class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 dark:has-[:checked]:bg-indigo-900/30 transition">
                <input type="radio" name="questionType" value="single" class="sr-only">
                <span class="text-sm">Single</span>
              </label>
              <label class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50 dark:has-[:checked]:bg-indigo-900/30 transition">
                <input type="radio" name="questionType" value="multi" class="sr-only">
                <span class="text-sm">Multi</span>
              </label>
            </div>
          </div>
        </div>

        <!-- Generate Button -->
        <button
          id="generateBtn"
          class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition flex items-center justify-center gap-2"
        >
          <span id="generateBtnText">Generate Quiz</span>
          <svg id="generateBtnSpinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>

        <!-- Status -->
        <p id="configStatus" class="mt-3 text-xs text-slate-500 dark:text-slate-400 text-center"></p>
      </div>

      <!-- Advanced: File Upload -->
      <details class="card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">
        <summary class="px-6 py-4 cursor-pointer text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
          Advanced: Upload Questions File
        </summary>
        <div class="px-6 pb-6">
          <p class="text-xs text-slate-500 dark:text-slate-400 mb-3">
            Upload a text file with questions in standard MCQ format (Q1., A) B) C) D), Answer: A)
          </p>
          <label class="block w-full py-8 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl text-center cursor-pointer hover:border-indigo-400 transition">
            <input type="file" id="fileInput" accept=".txt,.md" class="sr-only">
            <span class="text-sm text-slate-600 dark:text-slate-400">Click to upload or drag and drop</span>
          </label>
        </div>
      </details>
    </section>

    <!-- Quiz Area -->
    <section id="quizArea" class="hidden space-y-6">
      <!-- Progress Bar -->
      <div class="card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
        <div class="flex items-center justify-between mb-2">
          <p id="progressText" class="text-sm font-medium">Answered 0 of 0</p>
          <button id="submitAllBtn" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold transition">
            Submit All
          </button>
        </div>
        <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
          <div id="progressFill" class="h-full bg-indigo-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- Question Palette -->
      <div id="palette" class="card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4">
        <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-3">Jump to question:</p>
        <div id="paletteGrid" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Questions List -->
      <div id="questionsList" class="space-y-4"></div>

      <!-- Summary Card -->
      <div id="summaryCard" class="hidden card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 text-center">
        <h3 class="text-lg font-bold mb-2">Quiz Complete!</h3>
        <div id="summaryBody"></div>
        <div class="mt-4 flex justify-center gap-3">
          <button id="reviewWrongBtn" class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            Review Incorrect
          </button>
          <button id="resetAfterBtn" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition">
            Try Again
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <!-- Footer -->
  <footer class="border-t border-slate-200 dark:border-slate-800 mt-auto py-6">
    <p class="text-center text-xs text-slate-500 dark:text-slate-400">
      QuizLab — Dynamic MCQ Practice Platform
    </p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
